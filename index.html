<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141517" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>مزاد الكراج</title>
    <meta name="description" content="مزاد سيارات حي بين الشباب: سيارات حقيقية من السوق السعودي، صور إعلانات، تقرير فحص، ولوحات مميزة." />
    <meta property="og:title" content="مزاد الكراج، الصالة مفتوحة" />
    <meta property="og:description" content="ادخل المزاد، سُم على السيارات، وابنِ أقوى كراج بين الشباب." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://garage-auction.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شعار مزاد الكراج: كلمة مزاد على بطاقة سعر حمراء فوق كلمة الكراج" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://garage-auction.vercel.app/og.png" />
    <!-- open the photo CDNs and the realtime brokers while the app boots -->
    <link rel="preconnect" href="https://postcdn.haraj.com.sa" />
    <link rel="preconnect" href="https://mimg6cdn.haraj.com.sa" />
    <link rel="dns-prefetch" href="https://broker.emqx.io" />
    <link rel="dns-prefetch" href="https://broker.hivemq.com" />
    <!-- home-screen app: opens without browser chrome, named and coloured like the top bar -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="مزاد الكراج" />
    <meta name="apple-mobile-web-app-title" content="مزاد الكراج" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <!-- boot splash: painted from this file alone while the bundle downloads; React's first render
         replaces everything inside #root. Colours are the base.css tokens (--bg, --green-900, --gold).
         The logo is plain text in one block marked LOGO below, so a new logo is a one-block swap. -->
    <style>
      html, body { background: #111214; }
      html.boot-tv, html.boot-tv body { background: #0b0c0d; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(130% 75% at 50% 0%, #2a2b30 0%, #17181b 52%, #0f1012 100%); }
      #boot .boot-bar { display: none; }
      #boot .boot-core { display: grid; justify-items: center; }
      /* LOGO: the stacked price-tag logo (public/brand/lockup.svg) */
      #boot .boot-logo { display: block; width: min(260px, 66vw); height: auto; opacity: 0; transform: translateY(-14px) rotate(-7deg) scale(.9); transition: opacity .4s cubic-bezier(.2, .8, .2, 1), transform .6s cubic-bezier(.2, 1.5, .4, 1); filter: drop-shadow(0 22px 24px rgba(0, 0, 0, .65)); }
      #boot.is-ready .boot-logo { opacity: 1; transform: none; }
      .boot-tv #boot .boot-logo { width: min(420px, 40vw); }
      /* end LOGO */
      #boot .boot-load { display: block; width: 120px; height: 6px; margin-top: 34px; border-radius: 99px; overflow: hidden; background: linear-gradient(180deg, #24262b, #141517); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); opacity: 0; animation: boot-in .4s .45s both; }
      #boot .boot-load i { display: block; width: 34px; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff4a4f, #c3161d); animation: boot-sweep 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }
      #boot noscript p { margin: 22px 0 0; font: 15px system-ui, sans-serif; color: #8d9098; }
      .boot-tv #boot { background: #0b0c0d; }
      .boot-tv #boot .boot-bar { display: none; }
      .boot-tv #boot .boot-core { padding-top: 0; }
      .boot-tv #boot .boot-load { width: 120px; background: rgba(255, 255, 255, .1); }
      .boot-tv #boot .boot-load i { width: 40px; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-sweep { from { transform: translateX(110%); } to { transform: translateX(-300%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-logo { transition: opacity .3s linear; transform: none; }
        #boot .boot-load i { animation: none; transform: translateX(-100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="مزاد الكراج، نفتح الصالة">
        <div class="boot-bar"></div>
        <div class="boot-core">
          <img class="boot-logo" src="/brand/lockup.svg?v=3" width="230" height="201" alt="" aria-hidden="true" />
          <span class="boot-load" aria-hidden="true"><i></i></span>
          <noscript><p>شغّل الجافاسكربت في المتصفح عشان تدخل المزاد</p></noscript>
        </div>
      </div>
    </div>
    <script>
      // the logo drops in once its drawing has loaded (capped, so a slow network never holds the splash
      // blank); the big screen («شاشة العرض», #/tv/…) boots on its own dark board
      (function () {
        var b = document.getElementById('boot');
        if (!b) return;
        if (/^#\/?tv\//.test(location.hash)) document.documentElement.classList.add('boot-tv');
        var done = function () { b.classList.add('is-ready'); };
        setTimeout(done, 700);
        var l = b.querySelector('.boot-logo');
        if (l) { if (l.complete) done(); else l.addEventListener('load', done); }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
